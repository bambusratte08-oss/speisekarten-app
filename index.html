<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Speisekarten aus dem Landkreis Haßberge – schnell, ohne Mumpitz, installierbar als App.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Speisekarten-Has – Landkreis Haßberge</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>🐇 Speisekarten-Has</h1>
        <p>Kurz und knapp. Speisekarten aus dem Landkreis Haßberge ohne viel Mumpitz.</p>
      </div>
      <button id="install" class="btn" style="display:none">📲 App installieren</button>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="🔍 Restaurant oder Ort suchen …">
    </div>
    <nav id="chips" class="chips"></nav>
  </header>

  <main>
    <section id="grid" class="grid"></section>
    <p id="empty" style="display:none" class="empty">Nichts gefunden – anderen Suchbegriff oder Filter probieren.</p>
  </main>

  <footer>
    <p>
      Quelle &amp; Fehlermeldungen:
      <a href="https://speisekartenhas.jimdofree.com/" target="_blank" rel="noopener">speisekartenhas.jimdofree.com</a>
      · <a href="https://speisekartenhas.weebly.com/" target="_blank" rel="noopener">weebly.com/speisekartenhas</a>
    </p>
  </footer>

  <div id="viewer">
    <header class="viewer-header">
      <div>
        <h2 id="viewer-title"></h2>
        <p id="viewer-sub"></p>
      </div>
      <button id="viewer-close" aria-label="Schließen">✕</button>
    </header>
    <div id="viewer-tabs" class="tabs"></div>
    <div class="viewer-actions">
      <button id="zoom-out" class="btn small">➖</button>
      <button id="zoom-in" class="btn small">➕ Plakatansicht</button>
    </div>
    <div id="viewer-body"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
